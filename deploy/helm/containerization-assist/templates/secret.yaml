apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ca.fullname" . }}-secrets
  labels:
    {{- include "ca.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.baseUrl }}
  OPENAI_BASE_URL: {{ .Values.llm.baseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.caApiKey }}
  CA_API_KEY: {{ .Values.secrets.caApiKey | b64enc | quote }}
  {{- end }}
