apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ca.fullname" . }}-api
  labels:
    {{- include "ca.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ca.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "ca.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ca.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        # --- API Server ---
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ca.fullname" . }}-config
            - secretRef:
                name: {{ include "ca.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if .Values.dind.enabled }}
          volumeMounts:
            - name: docker-certs
              mountPath: /certs/client
              readOnly: true
          {{- end }}
          {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/.data
          {{- end }}

        {{- if .Values.dind.enabled }}
        # --- Docker-in-Docker Sidecar ---
        - name: dind
          image: "{{ .Values.dind.image.repository }}:{{ .Values.dind.image.tag }}"
          imagePullPolicy: {{ .Values.dind.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: docker-storage
              mountPath: /var/lib/docker
          resources:
            {{- toYaml .Values.dind.resources | nindent 12 }}
        {{- end }}

      volumes:
        {{- if .Values.dind.enabled }}
        - name: docker-certs
          emptyDir: {}
        - name: docker-storage
          {{- if .Values.dind.storageClass }}
          persistentVolumeClaim:
            claimName: {{ include "ca.fullname" . }}-docker-storage
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.dind.storage }}
          {{- end }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ca.fullname" . }}-data
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
