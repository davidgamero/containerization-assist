apiVersion: v1
kind: Secret
metadata:
  name: {{ include "containerization-assist.fullname" . }}-auth
  labels:
    {{- include "containerization-assist.labels" . | nindent 4 }}
type: Opaque
stringData:
  github-client-id: {{ .Values.auth.github.clientId | quote }}
  github-client-secret: {{ .Values.auth.github.clientSecret | quote }}
  {{- range $key, $value := .Values.auth.apiKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
