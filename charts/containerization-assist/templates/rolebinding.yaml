{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if eq .Values.rbac.scope "cluster" }}ClusterRoleBinding{{ else }}RoleBinding{{ end }}
metadata:
  name: {{ include "containerization-assist.fullname" . }}
  labels:
    {{- include "containerization-assist.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if eq .Values.rbac.scope "cluster" }}ClusterRole{{ else }}Role{{ end }}
  name: {{ include "containerization-assist.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "containerization-assist.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
